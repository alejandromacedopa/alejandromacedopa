name: Generate Snake

# Genera la serpiente animada que "se come" tus contribuciones y la
# publica en la rama `output` del repo. El README la carga desde ahí.

on:
  schedule:
    - cron: "0 */12 * * *" # cada 12 horas
  workflow_dispatch: # permite ejecutarlo a mano desde la pestaña Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar SVGs de la serpiente
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7aa2f7&color_dots=#ebedf0,#c9d7f5,#a4bdf0,#7aa2f7,#4f6fcf
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#bb9af7&color_dots=#161b22,#2a3a66,#3d59a1,#7aa2f7,#bb9af7

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d">
<title id="t">Alejandro Macedo — Software Developer</title><desc id="d">Banner animado con el nombre, el rol y un fragmento de código.</desc>
<style>.sans{font-family:'Segoe UI','SF Pro Display',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}.mono{font-family:'SFMono-Regular','JetBrains Mono',Consolas,'Liberation Mono',Menlo,monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.blob1{animation:d1 16s ease-in-out infinite alternate}
.blob2{animation:d2 20s ease-in-out infinite alternate}
.blob3{animation:d3 13s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(90px,50px)}}
@keyframes d2{to{transform:translate(-110px,-40px)}}
@keyframes d3{to{transform:translate(60px,70px)}}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.role{opacity:0;animation:role 14s infinite}
.r1{animation-delay:0.0s}.r2{animation-delay:3.5s}.r3{animation-delay:7.0s}.r4{animation-delay:10.5s}
@keyframes role{0%{opacity:0;transform:translateY(8px)}3%{opacity:1;transform:none}22.00%{opacity:1;transform:none}25.00%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
.ln{opacity:0;animation:ln .5s ease forwards}
@keyframes ln{to{opacity:1}}
.shine{animation:sh 6s linear infinite}
@keyframes sh{from{transform:translateX(-1000px)}to{transform:translateX(1000px)}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d17"/><stop offset="1" stop-color="#151833"/></linearGradient>
<radialGradient id="g1"><stop offset="0" stop-color="#7aa2f7" stop-opacity="0.5"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/></radialGradient><radialGradient id="g2"><stop offset="0" stop-color="#bb9af7" stop-opacity="0.42"/><stop offset="1" stop-color="#bb9af7" stop-opacity="0"/></radialGradient><radialGradient id="g3"><stop offset="0" stop-color="#7dcfff" stop-opacity="0.28"/><stop offset="1" stop-color="#7dcfff" stop-opacity="0"/></radialGradient>
<linearGradient id="nm" gradientUnits="userSpaceOnUse" x1="48" y1="0" x2="580" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#b9c6ff"/><stop offset="1" stop-color="#bb9af7"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7aa2f7" stop-opacity="0"/><stop offset=".5" stop-color="#7aa2f7"/><stop offset="1" stop-color="#bb9af7" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7aa2f7" stroke-opacity=".08"/></pattern>
<radialGradient id="fg" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="gm"><rect width="1000" height="300" fill="url(#fg)"/></mask>
<clipPath id="cl"><rect width="1000" height="300" rx="22"/></clipPath></defs>

<g clip-path="url(#cl)">
  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect width="1000" height="300" fill="url(#grid)" mask="url(#gm)"/>
  <circle class="blob1" cx="120" cy="40" r="230" fill="url(#g1)"/>
  <circle class="blob2" cx="900" cy="270" r="260" fill="url(#g2)"/>
  <circle class="blob3" cx="520" cy="0" r="170" fill="url(#g3)"/>
  <g class="shine" opacity=".9"><rect x="0" y="297" width="1000" height="3" fill="url(#line)"/></g>
</g>
<rect x=".5" y=".5" width="999" height="299" rx="22" fill="none" stroke="#2a2e4a"/>

<text class="mono" x="48" y="62" font-size="15" xml:space="preserve"><tspan fill="#8b94bd">alejandro@dev</tspan><tspan fill="#7dcfff">:~$</tspan><tspan fill="#c0caf5"> whoami</tspan><tspan class="cur" fill="#7dcfff">_</tspan></text>

<text class="sans" x="46" y="146" font-size="62" font-weight="800" fill="url(#nm)" textLength="540" lengthAdjust="spacingAndGlyphs">Alejandro Macedo</text>
<text class="sans" x="48" y="188" font-size="24" font-weight="600" fill="#c0caf5" textLength="205" lengthAdjust="spacingAndGlyphs">Software Developer</text>
<rect x="270" y="176" width="44" height="3" rx="1.5" fill="#7aa2f7"/>

<text class="mono role r1" x="48" y="232" font-size="18" fill="#7dcfff"><tspan fill="#bb9af7">› </tspan>Backends con NestJS + PostgreSQL</text>
<text class="mono role r2" x="48" y="232" font-size="18" fill="#7dcfff"><tspan fill="#bb9af7">› </tspan>Sistemas SaaS multi-tenant</text>
<text class="mono role r3" x="48" y="232" font-size="18" fill="#7dcfff"><tspan fill="#bb9af7">› </tspan>Paneles web con Angular y Next.js</text>
<text class="mono role r4" x="48" y="232" font-size="18" fill="#7dcfff"><tspan fill="#bb9af7">› </tspan>APIs con Spring Boot y apps con Flutter</text>

<g>
  <rect x="628" y="40" width="336" height="220" rx="14" fill="#0b0d19" stroke="#2a2e4a"/>
  <path d="M628 54a14 14 0 0 1 14-14h308a14 14 0 0 1 14 14v22H628z" fill="#12152a"/>
  <circle cx="650" cy="58" r="5" fill="#ff5f57"/><circle cx="668" cy="58" r="5" fill="#febc2e"/><circle cx="686" cy="58" r="5" fill="#28c840"/>
  <text class="mono" x="796" y="62" font-size="12" fill="#565f89" text-anchor="middle">alejandro.ts</text>
  <text class="mono ln" style="animation-delay:0.40s" x="652" y="102" font-size="13" xml:space="preserve"><tspan fill="#bb9af7">const </tspan><tspan fill="#7aa2f7">dev</tspan><tspan fill="#8b94bd"> = {</tspan></text>
<text class="mono ln" style="animation-delay:0.70s" x="652" y="122" font-size="13" xml:space="preserve"><tspan fill="#7dcfff">  nombre</tspan><tspan fill="#8b94bd">: </tspan><tspan fill="#9ece6a">"Alejandro"</tspan><tspan fill="#8b94bd">,</tspan></text>
<text class="mono ln" style="animation-delay:1.00s" x="652" y="142" font-size="13" xml:space="preserve"><tspan fill="#7dcfff">  db</tspan><tspan fill="#8b94bd">: </tspan><tspan fill="#9ece6a">"PostgreSQL"</tspan><tspan fill="#8b94bd">,</tspan></text>
<text class="mono ln" style="animation-delay:1.30s" x="652" y="162" font-size="13" xml:space="preserve"><tspan fill="#7dcfff">  api</tspan><tspan fill="#8b94bd">: [</tspan><tspan fill="#9ece6a">"NestJS"</tspan><tspan fill="#8b94bd">, </tspan><tspan fill="#9ece6a">"Spring"</tspan><tspan fill="#8b94bd">],</tspan></text>
<text class="mono ln" style="animation-delay:1.60s" x="652" y="182" font-size="13" xml:space="preserve"><tspan fill="#7dcfff">  web</tspan><tspan fill="#8b94bd">: [</tspan><tspan fill="#9ece6a">"Angular"</tspan><tspan fill="#8b94bd">, </tspan><tspan fill="#9ece6a">"Next"</tspan><tspan fill="#8b94bd">],</tspan></text>
<text class="mono ln" style="animation-delay:1.90s" x="652" y="202" font-size="13" xml:space="preserve"><tspan fill="#7dcfff">  mobile</tspan><tspan fill="#8b94bd">: </tspan><tspan fill="#9ece6a">"Flutter"</tspan><tspan fill="#8b94bd">,</tspan></text>
<text class="mono ln" style="animation-delay:2.20s" x="652" y="222" font-size="13" xml:space="preserve"><tspan fill="#7dcfff">  aprendiendo</tspan><tspan fill="#8b94bd">: </tspan><tspan fill="#ff9e64">true</tspan><tspan fill="#8b94bd">,</tspan></text>
<text class="mono ln" style="animation-delay:2.50s" x="652" y="242" font-size="13" xml:space="preserve"><tspan fill="#8b94bd">};</tspan></text>
</g>

</svg>
